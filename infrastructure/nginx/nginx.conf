events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging with Correlation IDs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_correlation_id"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream service clusters
    upstream auth_service {
        server host.docker.internal:4001;
    }

    upstream admin_service {
        server host.docker.internal:4002;
    }

    upstream inventory_service {
        server host.docker.internal:4003;
    }

    upstream search_service {
        server host.docker.internal:4004;
    }

    upstream booking_service {
        server host.docker.internal:4005;
    }

    upstream payment_service {
        server host.docker.internal:4006;
    }

    # API Gateway Server
    server {
        listen 80;
        server_name localhost;

        # Standard Gateway Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check
        location /health {
            return 200 '{"status":"healthy","gateway":"nginx-api-gateway"}';
            add_header Content-Type application/json;
        }

        # 1. Auth Service Routes
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 2. Admin Service Routes
        location /api/admin/ {
            proxy_pass http://admin_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 3. Inventory Service Routes
        location /api/inventory/ {
            proxy_pass http://inventory_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 4. Search Service Routes
        location /api/search/ {
            proxy_pass http://search_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 5. Booking Service Routes
        location /api/bookings/ {
            proxy_pass http://booking_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 6. Payment Service Routes
        location /api/payments/ {
            proxy_pass http://payment_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
